version: '3.8'

services:
  # Optional persistent PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: ai_cdss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: ai_cdss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ai_cdss_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./ai_cdss.db
      - JWT_SECRET_KEY=supersecretkey_change_in_production_ai_cdss_2026
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - MODEL_PATH=../ml/models
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - VECTOR_DB_PATH=../rag/vector_db
      - UPLOAD_DIR=./uploads
    volumes:
      - backend_data:/app/backend
      - backend_uploads:/app/backend/uploads
      - ../ml/data:/app/ml/data:ro

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ai_cdss_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
  backend_uploads:
